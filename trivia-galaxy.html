<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Trivia Galaxy — Quiz Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ============ RESET & BASE ============ */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: radial-gradient(circle at 20% 0%, var(--bg1), var(--bg2) 70%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.6s ease, color 0.4s ease;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
h1, h2, h3 { font-family: var(--font-display); }

/* ============ THEME TOKENS ============ */
:root, [data-theme="cosmic"] {
  --bg1: #1b1440; --bg2: #0a0a1f;
  --surface: rgba(255,255,255,0.06);
  --surface-solid: #191441;
  --border: rgba(255,255,255,0.14);
  --primary: #8b7bff; --primary-text: #0a0a1f;
  --accent: #ffd97a;
  --text: #f1eefc; --text-dim: #b8b0e0;
  --correct: #6ee7b7; --incorrect: #ff8a8a;
  --font-display: 'Baloo 2', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --card-style: 2px solid rgba(255,255,255,0.14);
  --radius: 20px;
  --glow: 0 0 30px rgba(139,123,255,0.35);
}

[data-theme="miku"] {
  --bg1: #0d2b2b; --bg2: #071616;
  --surface: rgba(57,197,187,0.08);
  --surface-solid: #0c2626;
  --border: rgba(57,197,187,0.35);
  --primary: #39C5BB; --primary-text: #052222;
  --accent: #ff6fa5;
  --text: #eafffb; --text-dim: #8fd8d0;
  --correct: #6ee7b7; --incorrect: #ff6fa5;
  --font-display: 'Poppins', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --card-style: 2px solid rgba(57,197,187,0.4);
  --radius: 18px;
  --glow: 0 0 30px rgba(57,197,187,0.45);
}

[data-theme="retro"] {
  --bg1: #1a0033; --bg2: #05000f;
  --surface: rgba(255,46,136,0.07);
  --surface-solid: #150029;
  --border: rgba(0,240,255,0.4);
  --primary: #ff2e88; --primary-text: #0a0a1f;
  --accent: #00f0ff;
  --text: #f5f0ff; --text-dim: #b9a8d8;
  --correct: #00f0ff; --incorrect: #ff2e88;
  --font-display: 'Press Start 2P', monospace;
  --font-body: 'Nunito', sans-serif;
  --card-style: 3px dashed rgba(0,240,255,0.5);
  --radius: 8px;
  --glow: 0 0 25px rgba(0,240,255,0.4);
}

[data-theme="forest"] {
  --bg1: #1b4332; --bg2: #0c1f17;
  --surface: rgba(116,198,157,0.08);
  --surface-solid: #12291f;
  --border: rgba(116,198,157,0.35);
  --primary: #74c69d; --primary-text: #0c1f17;
  --accent: #ffd60a;
  --text: #eafff0; --text-dim: #a9d4bd;
  --correct: #74c69d; --incorrect: #ff8a6a;
  --font-display: 'Baloo 2', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --card-style: 2px solid rgba(116,198,157,0.4);
  --radius: 22px;
  --glow: 0 0 30px rgba(116,198,157,0.3);
}

[data-theme="candy"] {
  --bg1: #fff0f6; --bg2: #ffe1f0;
  --surface: rgba(255,255,255,0.65);
  --surface-solid: #ffffff;
  --border: rgba(255,111,165,0.35);
  --primary: #ff6fa5; --primary-text: #ffffff;
  --accent: #7c5cff;
  --text: #4a1942; --text-dim: #8a5f80;
  --correct: #2dd4a7; --incorrect: #ff5c8a;
  --font-display: 'Baloo 2', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --card-style: 3px solid rgba(255,111,165,0.4);
  --radius: 26px;
  --glow: 0 0 25px rgba(255,111,165,0.25);
}

[data-theme="cyberpunk"] {
  --bg1: #0d0d0d; --bg2: #000000;
  --surface: rgba(57,255,20,0.06);
  --surface-solid: #0a0f0a;
  --border: rgba(57,255,20,0.35);
  --primary: #39ff14; --primary-text: #05100a;
  --accent: #ff006e;
  --text: #d9ffe6; --text-dim: #7fbf95;
  --correct: #39ff14; --incorrect: #ff006e;
  --font-display: 'Press Start 2P', monospace;
  --font-body: 'Nunito', sans-serif;
  --card-style: 2px solid rgba(57,255,20,0.4);
  --radius: 10px;
  --glow: 0 0 30px rgba(57,255,20,0.35);
}

[data-theme="ocean"] {
  --bg1: #013a63; --bg2: #011c30;
  --surface: rgba(72,202,228,0.08);
  --surface-solid: #012844;
  --border: rgba(72,202,228,0.35);
  --primary: #48cae4; --primary-text: #012030;
  --accent: #ff9f6f;
  --text: #e0fbfc; --text-dim: #9fd3de;
  --correct: #48cae4; --incorrect: #ff9f6f;
  --font-display: 'Baloo 2', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --card-style: 2px solid rgba(72,202,228,0.4);
  --radius: 24px;
  --glow: 0 0 30px rgba(72,202,228,0.3);
}

/* ============ PARTICLES ============ */
#particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.particle {
  position: absolute; bottom: -10%; color: var(--accent);
  animation-name: floatUp, twinkle;
  animation-timing-function: linear, ease-in-out;
  animation-iteration-count: infinite, infinite;
  filter: drop-shadow(0 0 6px currentColor);
}
[data-theme="miku"] .particle { animation-name: floatUp, pulseGlow; }
[data-theme="retro"] .particle,
[data-theme="cyberpunk"] .particle { animation-name: floatUp, flicker; }
[data-theme="forest"] .particle { animation-name: floatUp, flicker; }
[data-theme="candy"] .particle { animation-name: floatUp, spin; }
[data-theme="ocean"] .particle { animation-name: floatUp, wobble; }

@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
}
@keyframes twinkle { 0%, 100% { opacity: 0.3; scale: 0.85; } 50% { opacity: 1; scale: 1.15; } }
@keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 4px currentColor); } 50% { filter: drop-shadow(0 0 16px currentColor); } }
@keyframes flicker { 0%, 100% { opacity: 0.25; } 25% { opacity: 0.9; } 50% { opacity: 0.4; } 75% { opacity: 1; } }
@keyframes spin { from { rotate: 0deg; } to { rotate: 360deg; } }
@keyframes wobble { 0%, 100% { translate: 0 0; } 50% { translate: 12px 0; } }

.shooting-star {
  position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
  box-shadow: 0 0 8px 3px #fff, -60px 12px 12px -4px rgba(255,255,255,0.5);
  animation: shoot 1.3s linear forwards;
}
@keyframes shoot {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(-260px, 190px) rotate(0deg); opacity: 0; }
}

.burst-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.burst-particle {
  position: fixed; transform: translate(-50%, -50%);
  animation: burstOut 0.8s cubic-bezier(.2,.8,.3,1) forwards;
  filter: drop-shadow(0 0 6px currentColor); color: var(--accent);
}
@keyframes burstOut {
  0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .particle, .shooting-star, .burst-particle { animation: none; display: none; }
}

#liquid-output {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  z-index: 4; pointer-events: none; mix-blend-mode: screen;
}
@media (prefers-reduced-motion: reduce) {
  #liquid-output { display: none; }
}

/* ============ LAYOUT ============ */
.app-shell {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  min-height: 100vh;
  padding: 18px 18px 40px;
  display: flex; flex-direction: column;
}
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 10px;
}
.app-title {
  font-size: 1.35rem; font-weight: 800; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 8px;
}
.app-title .spark { color: var(--accent); }
.header-controls { display: flex; align-items: center; gap: 8px; }
#btn-mute {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
  border: 1.5px solid var(--border); font-size: 0.95rem;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: transform 0.15s ease;
}
#btn-mute:active { transform: scale(0.9); }
#theme-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.theme-dot {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.theme-dot.active { box-shadow: 0 0 0 2px var(--accent), var(--glow); transform: scale(1.12); }
.theme-dot:active { transform: scale(0.94); }

.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ============ HOME ============ */
.home-hero { text-align: center; margin: 10px 0 24px; }
.home-hero h1 {
  font-size: 1.9rem; line-height: 1.15; margin-bottom: 8px;
}
.home-hero p { color: var(--text-dim); font-size: 0.95rem; }

.mode-card {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  background-color: var(--surface); border: var(--card-style); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; text-align: left; width: 100%;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  backdrop-filter: blur(6px);
}
.mode-card:active { transform: scale(0.97); }
.mode-card:hover { box-shadow: var(--glow); }
.mode-icon {
  font-size: 1.8rem; width: 52px; height: 52px; flex-shrink: 0;
  border-radius: 14px; background: var(--primary); color: var(--primary-text);
  display: flex; align-items: center; justify-content: center;
}
.mode-info h3 { font-size: 1.05rem; margin-bottom: 3px; }
.mode-info p { font-size: 0.83rem; color: var(--text-dim); line-height: 1.3; }

.stat-row { display: flex; gap: 10px; margin-top: 6px; }
.stat-chip {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 10px; text-align: center;
}
.stat-chip .num { font-family: var(--font-display); font-size: 1.2rem; color: var(--accent); }
.stat-chip .lbl { font-size: 0.72rem; color: var(--text-dim); }

/* ============ SETUP ============ */
.back-btn { align-self: flex-start; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 10px; }
.screen-title { font-size: 1.4rem; margin-bottom: 6px; }
.screen-desc { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 18px; }
.section-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 14px 0 8px; }
.section-label-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
.section-label-row .section-label { margin: 0; }
.hint-text { font-size: 0.78rem; color: var(--text-dim); margin-top: 8px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 14px; border-radius: 999px; background: var(--surface);
  border: 1.5px solid var(--border); font-size: 0.86rem; color: var(--text);
  transition: all 0.15s ease;
}
.chip:active { transform: scale(0.96); }
.chip-active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); font-weight: 700; }
.chip-fun { border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip-fun.chip-active { background: var(--accent); color: var(--bg2); border-style: solid; }
.fire-badge {
  display: inline-flex; align-items: center; gap: 2px; margin-left: 6px;
  background: linear-gradient(135deg, #ff9a3d, #ff3d3d); color: #fff;
  font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 999px;
  box-shadow: 0 0 10px rgba(255,90,30,0.55);
  animation: fireBadgePulse 1.6s ease-in-out infinite;
  vertical-align: middle;
}
@keyframes fireBadgePulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(255,90,30,0.5); }
  50% { transform: scale(1.08); box-shadow: 0 0 16px rgba(255,90,30,0.85); }
}
.cat-chip { display: inline-flex; align-items: center; }
.cat-check { display: inline-block; width: 0; overflow: hidden; transition: width 0.15s ease; font-weight: 800; }
.cat-chip.chip-active .cat-check { width: 14px; margin-right: 2px; }
.mini-btn-active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
.btn-start { margin-top: 26px; }

/* ============ BUTTONS ============ */
.btn-primary {
  background: var(--primary); color: var(--primary-text);
  padding: 14px; border-radius: 14px; font-weight: 800; font-size: 1rem;
  width: 100%; box-shadow: var(--glow);
  transition: transform 0.12s ease;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; box-shadow: none; }
.btn-secondary {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  padding: 13px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; width: 100%;
}
.btn-ghost { color: var(--text-dim); padding: 10px; font-size: 0.88rem; width: 100%; }

/* ============ GAME ============ */
.game-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.progress-label { font-weight: 700; color: var(--text-dim); font-size: 0.9rem; }
.quit-btn {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
  border: 1px solid var(--border); font-size: 1.1rem; line-height: 1;
}
.score-pill {
  align-self: flex-start; background: var(--accent); color: var(--bg2);
  font-weight: 800; font-size: 0.8rem; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
}
.progress-track {
  height: 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  overflow: hidden; margin-bottom: 12px;
}
.progress-fill {
  height: 100%; background: var(--primary); border-radius: 999px;
  transition: width 0.35s ease; box-shadow: 0 0 10px var(--primary);
}
.question-card {
  position: relative; overflow: hidden;
  background-color: var(--surface); border: var(--card-style); border-radius: var(--radius);
  padding: 22px 18px; margin-bottom: 16px; backdrop-filter: blur(6px);
  box-shadow: var(--glow);
}
.cat-tag {
  display: inline-block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--accent); font-weight: 800; margin-bottom: 8px;
}
.question-text { font-size: 1.15rem; line-height: 1.4; }

.options-grid { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
  padding: 13px 14px; font-size: 0.95rem; transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  animation: optionIn 0.32s ease both;
}
@keyframes optionIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.option-btn:active { transform: scale(0.98); }
.opt-letter {
  width: 26px; height: 26px; border-radius: 8px; background: var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
}
.option-btn.correct { background: color-mix(in srgb, var(--correct) 25%, var(--surface)); border-color: var(--correct); }
.option-btn.incorrect { background: color-mix(in srgb, var(--incorrect) 25%, var(--surface)); border-color: var(--incorrect); }
.option-btn.dim { opacity: 0.5; }

.feedback { margin: 14px 0; font-weight: 700; text-align: center; }
.correct-text { color: var(--correct); }
.incorrect-text { color: var(--incorrect); }

/* ============ REVEAL MODE ============ */
.reveal-option { pointer-events: none; }
.check { color: var(--correct); font-weight: 800; margin-left: 4px; }
.reveal-nav { display: flex; gap: 10px; margin-top: 4px; }
.reveal-nav .btn-secondary { flex: 1; }
.reveal-nav .btn-primary { flex: 2; }

.scoreboard {
  margin-top: 22px; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.scoreboard-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.scoreboard-head h3 { font-size: 1rem; }
.scoreboard-controls { display: flex; gap: 6px; }
.mini-btn {
  background: var(--surface-solid); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 9px; font-size: 0.72rem; color: var(--text-dim); font-weight: 700;
}
.players-list { display: flex; flex-direction: column; gap: 8px; }
.player-row { display: flex; align-items: center; gap: 8px; }
.player-name {
  flex: 1; background: var(--surface-solid); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 8px 10px; font-size: 0.88rem; min-width: 0;
}
.pts-btn {
  width: 30px; height: 30px; border-radius: 8px; background: var(--surface-solid);
  border: 1px solid var(--border); font-weight: 800; font-size: 1rem; flex-shrink: 0;
}
.pts-btn.plus { color: var(--correct); }
.pts-btn.minus { color: var(--incorrect); }
.pts-value { min-width: 22px; text-align: center; font-weight: 800; font-family: var(--font-display); }

/* ============ RESULTS ============ */
#screen-results { align-items: center; text-align: center; justify-content: center; flex: 1; }
.results-score { font-family: var(--font-display); font-size: 3rem; margin: 14px 0 4px; color: var(--accent); }
.results-pct { color: var(--text-dim); margin-bottom: 6px; font-size: 0.95rem; }
.results-msg { margin-bottom: 26px; font-size: 1rem; }
.results-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* ============ RETRO / CYBERPUNK EXTRAS ============ */
[data-theme="retro"] .question-text, [data-theme="cyberpunk"] .question-text { line-height: 1.55; }
[data-theme="retro"] .app-title, [data-theme="cyberpunk"] .app-title { font-size: 1rem; letter-spacing: 0; }
[data-theme="retro"] .screen-title, [data-theme="cyberpunk"] .screen-title { font-size: 1.05rem; }
[data-theme="retro"] .results-score, [data-theme="cyberpunk"] .results-score { font-size: 2.1rem; }

[data-theme="retro"] body::before, [data-theme="cyberpunk"] body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 40;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: overlay;
}
@keyframes glitchFlicker {
  0%, 92%, 100% { text-shadow: 0 0 0 transparent; transform: translateX(0); }
  93% { text-shadow: 2px 0 var(--accent), -2px 0 var(--primary); transform: translateX(-1px); }
  95% { text-shadow: -2px 0 var(--accent), 2px 0 var(--primary); transform: translateX(1px); }
  97% { text-shadow: 1px 0 var(--accent), -1px 0 var(--primary); transform: translateX(0); }
}
[data-theme="retro"] .app-title, [data-theme="cyberpunk"] .app-title { animation: glitchFlicker 5s infinite; display: inline-flex; }

/* ============ OCEAN EXTRAS ============ */
[data-theme="ocean"] .question-card, [data-theme="ocean"] .mode-card {
  background-image: linear-gradient(120deg, transparent 20%, rgba(72,202,228,0.18) 50%, transparent 80%);
  background-size: 250% 250%;
  animation: waveShift 7s ease-in-out infinite;
}
@keyframes waveShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

/* ============ CANDY EXTRAS ============ */
[data-theme="candy"] .question-card::before,
[data-theme="candy"] .mode-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: repeating-linear-gradient(45deg, var(--primary) 0 8px, #fff 8px 16px);
}
@keyframes fadeInBounce { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
[data-theme="candy"] .screen.active { animation: fadeInBounce 0.5s cubic-bezier(.34,1.56,.64,1); }
[data-theme="candy"] .btn-primary:active, [data-theme="candy"] .mode-card:active, [data-theme="candy"] .option-btn:active {
  transform: scale(0.94);
}

/* ============ MIKU EXTRAS ============ */
[data-theme="miku"] .btn-primary { animation: mikuGlow 2.2s ease-in-out infinite; }
@keyframes mikuGlow {

precision highp float;
layout(location = 0) in vec2 aPos;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
uniform vec2 texelSize;
void main () {
  vUv = aPos * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);

precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uFluid;
uniform vec3 uColor;

  vec3 fluid = texture(uFluid, vUv).rgb;
  float mag = length(fluid);
  vec3 tint = uRainbow == 1.0 ? clamp(fluid / max(mag, 1e-3), 0.0, 1.0) : uColor;
  float overlay = (1.0 - exp(-mag * uIntensity * 0.5)) * 0.82;
  outColor = vec4(toSrgb(clamp(tint, 0.0, 1.0)) * overlay, overlay);

uniform vec2 uPoint;

void main () {

  p.x *= uAspect;
  vec3 splat = exp(-dot(p, p) / uRadius) * uColor;

  float R = texture(uVelocity, vR).y;
  float T = texture(uVelocity, vT).x;
  float B = texture(uVelocity, vB).x;
  float vorticity = R - L - T + B;
  outColor = vec4(vorticity, 0.0, 0.0, 1.0);
}`;

  const FRAG_VORTICITY = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float uCurlStrength;
uniform float uDt;
void main () {
  float L = texture(uCurl, vL).x;
  float R = texture(uCurl, vR).x;
  float T = texture(uCurl, vT).x;
  float B = texture(uCurl, vB).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = vec2(abs(T) - abs(B), abs(R) - abs(L)) * 0.5;
  force /= length(force) + 1.0;
  force *= uCurlStrength * C;
  force.y *= -1.0;
  vec2 velocity = texture(uVelocity, vUv).xy;
  outColor = vec4(velocity + force * uDt, 0.0, 1.0);
}`;

  const FRAG_PRESSURE = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  float divergence = texture(uDivergence, vUv).x;
  float pressure = (L + R + B + T - divergence) * 0.25;
  outColor = vec4(pressure, 0.0, 0.0, 1.0);
}`;

  const FRAG_GRADIENT = `#version 300 es
precision highp float;
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
out vec4 outColor;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main () {
  float L = texture(uPressure, vL).x;
  float R = texture(uPressure, vR).x;
  float T = texture(uPressure, vT).x;
  float B = texture(uPressure, vB).x;
  vec2 velocity = texture(uVelocity, vUv).xy;
  velocity.xy -= vec2(R - L, T - B);
  outColor = vec4(velocity, 0.0, 1.0);
}`;

  function createLiquid(elements, options) {
    options = options || {};
    const DEFAULTS = {
      simResolution: 128,
      dyeResolution: 512,
      densityDissipation: 0.96,
      velocityDissipation: 1,
      pressure: 0.8,
      pressureIterations: 4,
      curl: 1.9,
      radius: 0.3,
      force: 1.1,
      intensity: 2,
      distortion: 0.4,
      blend: 5,
      color: [0.145, 0.239, 0.867],
      rainbow: false,
    };
    const config = Object.assign({}, DEFAULTS, options);
    const output = elements.output;

    const gl = output.getContext('webgl2', {
      alpha: true, depth: false, stencil: false, antialias: false, premultipliedAlpha: true,
    });
    if (!gl || gl.isContextLost()) return null;

    const supportsFloatTargets = Boolean(
      gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float')
    );
    if (!supportsFloatTargets) return null;

    const supportsLinear = Boolean(gl.getExtension('OES_texture_float_linear'));
    const filtering = supportsLinear ? gl.LINEAR : gl.NEAREST;

    const shaders = [];
    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('LiquidFX shader error:', gl.getShaderInfoLog(shader));
      }
      shaders.push(shader);
      return shader;
    }
    const vertexShader = compile(gl.VERTEX_SHADER, VERT);

    const programs = [];
    function createProgram(fragSource) {
      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSource));
      gl.linkProgram(program);
      programs.push(program);
      const uniforms = {};
      const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < count; i++) {
        const info = gl.getActiveUniform(program, i);
        uniforms[info.name] = gl.getUniformLocation(program, info.name);
      }
      return { program, uniforms };
    }

    const displayProgram = createProgram(FRAG_DISPLAY);
    const splatProgram = createProgram(FRAG_SPLAT);
    const advectProgram = createProgram(FRAG_ADVECT);
    const clearProgram = createProgram(FRAG_CLEAR);
    const divergenceProgram = createProgram(FRAG_DIVERGENCE);
    const curlProgram = createProgram(FRAG_CURL);
    const vorticityProgram = createProgram(FRAG_VORTICITY);
    const pressureProgram = createProgram(FRAG_PRESSURE);
    const gradientProgram = createProgram(FRAG_GRADIENT);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    function createTarget(size, internalFormat, format, filter) {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, size, size, 0, format, gl.HALF_FLOAT, null);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
      gl.viewport(0, 0, size, size);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return { fbo, texture, width: size, height: size };
    }

    function createDoubleTarget(size, internalFormat, format, filter) {
      let read = createTarget(size, internalFormat, format, filter);
      let write = createTarget(size, internalFormat, format, filter);
      return {
        get read() { return read; },
        get write() { return write; },
        swap() { const t = read; read = write; write = t; },
      };
    }

    function createFluidTargets(simResolution, dyeResolution) {
      return {
        velocity: createDoubleTarget(simResolution, gl.RG16F, gl.RG, filtering),
        dye: createDoubleTarget(dyeResolution, gl.RGBA16F, gl.RGBA, filtering),
        divergence: createTarget(simResolution, gl.R16F, gl.RED, gl.NEAREST),
        curl: createTarget(simResolution, gl.R16F, gl.RED, gl.NEAREST),
        pressure: createDoubleTarget(simResolution, gl.R16F, gl.RED, gl.NEAREST),
      };
    }

    let fluidTargets = createFluidTargets(config.simResolution, config.dyeResolution);

    function releaseTargets(targets) {
      [targets.velocity.read, targets.velocity.write, targets.dye.read, targets.dye.write,
        targets.pressure.read, targets.pressure.write, targets.divergence, targets.curl].forEach((t) => {
        gl.deleteFramebuffer(t.fbo);
        gl.deleteTexture(t.texture);
      });
    }

    function rebuildFluidTargets(simResolution, dyeResolution) {
      const next = createFluidTargets(simResolution, dyeResolution);
      const previous = fluidTargets;
      fluidTargets = next;
      releaseTargets(previous);
    }

    let texelX = 0, texelY = 0;
    function updateTexelSize() {
      const width = Math.max(output.clientWidth, 1);
      const height = Math.max(output.clientHeight, 1);
      texelX = 1 / (config.simResolution * (width / (height + 400)));
      texelY = 1 / config.simResolution;
    }

    function syncCanvasSize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(output.clientWidth * dpr));
      const height = Math.max(1, Math.round(output.clientHeight * dpr));
      if (output.width !== width || output.height !== height) {
        output.width = width;
        output.height = height;
      }
      updateTexelSize();
    }
    syncCanvasSize();

    let time_ = 0; // unused placeholder to avoid confusion with DT const name collisions

    function blit(target) {
      if (target) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
        gl.viewport(0, 0, target.width, target.height);
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, output.width, output.height);
      }
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function bindTexture(texture, unit) {
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      return unit;
    }

    function applySplat(x, y, dx, dy) {
      const aspect = output.clientWidth / Math.max(output.clientHeight, 1);
      const radius = config.radius / 100;
      gl.useProgram(splatProgram.program);
      gl.uniform1i(splatProgram.uniforms.uTarget, bindTexture(fluidTargets.velocity.read.texture, 0));
      gl.uniform1f(splatProgram.uniforms.uAspect, aspect);
      gl.uniform2f(splatProgram.uniforms.uPoint, x, y);
      gl.uniform3f(splatProgram.uniforms.uColor, dx, dy, 10);
      gl.uniform1f(splatProgram.uniforms.uRadius, radius);
      blit(fluidTargets.velocity.write);
      fluidTargets.velocity.swap();
      gl.uniform1i(splatProgram.uniforms.uTarget, bindTexture(fluidTargets.dye.read.texture, 0));
      blit(fluidTargets.dye.write);
      fluidTargets.dye.swap();
    }

    function step(delta) {
      gl.disable(gl.BLEND);
      gl.useProgram(curlProgram.program);
      gl.uniform2f(curlProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(curlProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 0));
      blit(fluidTargets.curl);

      gl.useProgram(vorticityProgram.program);
      gl.uniform2f(vorticityProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(vorticityProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 0));
      gl.uniform1i(vorticityProgram.uniforms.uCurl, bindTexture(fluidTargets.curl.texture, 1));
      gl.uniform1f(vorticityProgram.uniforms.uCurlStrength, config.curl);
      gl.uniform1f(vorticityProgram.uniforms.uDt, DT);
      blit(fluidTargets.velocity.write);
      fluidTargets.velocity.swap();

      gl.useProgram(divergenceProgram.program);
      gl.uniform2f(divergenceProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(divergenceProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 0));
      blit(fluidTargets.divergence);

      gl.useProgram(clearProgram.program);
      gl.uniform1i(clearProgram.uniforms.uTexture, bindTexture(fluidTargets.pressure.read.texture, 0));
      gl.uniform1f(clearProgram.uniforms.uValue, Math.pow(config.pressure, delta * 60));
      blit(fluidTargets.pressure.write);
      fluidTargets.pressure.swap();

      gl.useProgram(pressureProgram.program);
      gl.uniform2f(pressureProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(pressureProgram.uniforms.uDivergence, bindTexture(fluidTargets.divergence.texture, 0));
      for (let i = 0; i < config.pressureIterations; i++) {
        gl.uniform1i(pressureProgram.uniforms.uPressure, bindTexture(fluidTargets.pressure.read.texture, 1));
        blit(fluidTargets.pressure.write);
        fluidTargets.pressure.swap();
      }

      gl.useProgram(gradientProgram.program);
      gl.uniform2f(gradientProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(gradientProgram.uniforms.uPressure, bindTexture(fluidTargets.pressure.read.texture, 0));
      gl.uniform1i(gradientProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 1));
      blit(fluidTargets.velocity.write);
      fluidTargets.velocity.swap();

      gl.useProgram(advectProgram.program);
      gl.uniform2f(advectProgram.uniforms.texelSize, texelX, texelY);
      gl.uniform1i(advectProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 0));
      gl.uniform1i(advectProgram.uniforms.uSource, bindTexture(fluidTargets.velocity.read.texture, 0));
      gl.uniform1f(advectProgram.uniforms.uDt, DT);
      gl.uniform1f(advectProgram.uniforms.uDissipation, Math.pow(config.velocityDissipation, delta * 60));
      blit(fluidTargets.velocity.write);
      fluidTargets.velocity.swap();

      gl.uniform1i(advectProgram.uniforms.uVelocity, bindTexture(fluidTargets.velocity.read.texture, 0));
      gl.uniform1i(advectProgram.uniforms.uSource, bindTexture(fluidTargets.dye.read.texture, 1));
      gl.uniform1f(advectProgram.uniforms.uDissipation, Math.pow(config.densityDissipation, delta * 60));
      blit(fluidTargets.dye.write);
      fluidTargets.dye.swap();
    }

    function render() {
      gl.useProgram(displayProgram.program);
      gl.uniform1i(displayProgram.uniforms.uFluid, bindTexture(fluidTargets.dye.read.texture, 1));
      gl.uniform3f(
        displayProgram.uniforms.uColor,
        srgbToLinear(config.color[0]), srgbToLinear(config.color[1]), srgbToLinear(config.color[2])
      );
      gl.uniform1f(displayProgram.uniforms.uIntensity, config.intensity);
      gl.uniform1f(displayProgram.uniforms.uRainbow, config.rainbow ? 1 : 0);
      blit(null);
    }

    const queued = [];
    let raf = 0;
    let lastTime = performance.now();
    let destroyed = false;
    let running = false;
    let visible = true;
    let idleAt = 0;

    function idleDelayMs() {
      const dissipation = Math.min(config.densityDissipation, 0.999);
      const frames = Math.log(1e-7) / Math.log(dissipation);
      return (frames / 60) * 1000;
    }

    function frame(now) {
      if (destroyed) return;
      if (!visible) { running = false; return; }
      const delta = Math.min((now - lastTime) / 1000, 1 / 30);
      lastTime = now;
      if (queued.length > 0) {
        idleAt = now + idleDelayMs();
        while (queued.length > 0) {
          const s = queued.pop();
          applySplat(s[0], s[1], s[2], s[3]);
        }
      }
      step(delta);
      render();
      if (now >= idleAt) { running = false; return; }
      raf = requestAnimationFrame(frame);
    }

    function start() {
      if (destroyed || running || !visible) return;
      running = true;
      lastTime = performance.now();
      raf = requestAnimationFrame(frame);
    }
    start();

    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    let reducedMotion = motionQuery.matches;
    function onMotionChange() {
      reducedMotion = motionQuery.matches;
      if (!reducedMotion) start();
    }
    motionQuery.addEventListener('change', onMotionChange);

    const pointers = new Map();
    function onPointerMove(event) {
      if (reducedMotion) return;
      const rect = output.getBoundingClientRect();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      if (px < 0 || px > rect.width || py < 0 || py > rect.height) {
        pointers.delete(event.pointerId);
        return;
      }
      const previous = pointers.get(event.pointerId);
      pointers.set(event.pointerId, { x: px, y: py });
      if (!previous) return;
      const dx = (px - previous.x) * config.force;
      const dy = -(py - previous.y) * config.force;
      queued.push([px / rect.width, 1 - py / rect.height, dx, dy]);
      start();
    }
    function onPointerDown(event) {
      if (reducedMotion) return;
      const rect = output.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      if (x < 0 || x > rect.width || y < 0 || y > rect.height) return;
      pointers.set(event.pointerId, { x, y });
      queued.push([x / rect.width, 1 - y / rect.height, 1, 1]);
      start();
    }
    function onPointerLeave(event) { pointers.delete(event.pointerId); }

    const listenTarget = window;
    listenTarget.addEventListener('pointerdown', onPointerDown, { passive: true });
    listenTarget.addEventListener('pointermove', onPointerMove, { passive: true });
    listenTarget.addEventListener('pointerup', onPointerLeave, { passive: true });
    listenTarget.addEventListener('pointerleave', onPointerLeave);
    listenTarget.addEventListener('pointercancel', onPointerLeave);

    const observer = new ResizeObserver(() => { syncCanvasSize(); start(); });
    observer.observe(output);

    const intersection = new IntersectionObserver((entries) => {
      visible = entries[entries.length - 1] ? entries[entries.length - 1].isIntersecting : true;
      if (visible) start();
    });
    intersection.observe(output);

    return {
      splat(x, y, dx, dy) {
        if (reducedMotion) return;
        queued.push([x, y, dx, dy]);
        start();
      },
      setOptions(next) {
        const changed = Object.keys(next).some((key) => config[key] !== next[key]);
        if (!changed) return;
        const simResolution = next.simResolution !== undefined ? next.simResolution : config.simResolution;
        const dyeResolution = next.dyeResolution !== undefined ? next.dyeResolution : config.dyeResolution;
        const resolutionChanged = simResolution !== config.simResolution || dyeResolution !== config.dyeResolution;
        if (resolutionChanged) {
          rebuildFluidTargets(simResolution, dyeResolution);
          config.simResolution = simResolution;
          config.dyeResolution = dyeResolution;
          updateTexelSize();
        }
        Object.assign(config, next);
        start();
      },
      resize() { syncCanvasSize(); start(); },
      destroy() {
        destroyed = true;
        cancelAnimationFrame(raf);
        observer.disconnect();
        intersection.disconnect();
        motionQuery.removeEventListener('change', onMotionChange);
        releaseTargets(fluidTargets);
        programs.forEach((p) => gl.deleteProgram(p));
        shaders.forEach((s) => gl.deleteShader(s));
        gl.deleteBuffer(quad);
        listenTarget.removeEventListener('pointerdown', onPointerDown);
        listenTarget.removeEventListener('pointermove', onPointerMove);
        listenTarget.removeEventListener('pointerup', onPointerLeave);
        listenTarget.removeEventListener('pointerleave', onPointerLeave);
        listenTarget.removeEventListener('pointercancel', onPointerLeave);
      },
    };
  }

  return { createLiquid };
})();

</script>
<script>
/* ============ STATE ============ */
const state = {
  theme: 'cosmic',
  screen: 'home',       // home | setup | game | reveal | results
  mode: null,            // classic | streak | reveal
  gradeKey: null,
  selectedCategories: [],
  roundLength: 10,
  pool: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  answered: false,
  selected: null,
  revealed: false,
  muted: false,
  players: [
    { name: 'Player 1', pts: 0 },
    { name: 'Player 2', pts: 0 },
  ],
};

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* ============ LIQUID FX (pointer trail, powered by Canvas UI's Liquid) ============ */
const THEME_TRAIL_COLOR = {
  cosmic: [0.545, 0.482, 1.0],
  miku: [0.224, 0.773, 0.733],
  retro: [0.0, 0.941, 1.0],
  forest: [0.455, 0.776, 0.616],
  candy: [1.0, 0.435, 0.647],
  cyberpunk: [0.224, 1.0, 0.078],
  ocean: [0.282, 0.792, 0.894],
};
const THEME_TRAIL_RAINBOW = { retro: true, cyberpunk: true };
let liquidInstance = null;
function initLiquidFx() {
  const canvas = document.getElementById('liquid-output');
  if (!canvas || typeof LiquidFX === 'undefined') return;
  try {
    liquidInstance = LiquidFX.createLiquid(
      { output: canvas },
      {
        simResolution: 96,
        dyeResolution: 384,
        pressureIterations: 3,
        force: 1.0,
        radius: 0.28,
        intensity: 1.8,
        curl: 1.6,
        densityDissipation: 0.95,
        color: THEME_TRAIL_COLOR[state.theme] || THEME_TRAIL_COLOR.cosmic,
        rainbow: Boolean(THEME_TRAIL_RAINBOW[state.theme]),
      }
    );
  } catch (e) { liquidInstance = null; }
}
function updateLiquidFxTheme() {
  if (!liquidInstance) return;
  liquidInstance.setOptions({
    color: THEME_TRAIL_COLOR[state.theme] || THEME_TRAIL_COLOR.cosmic,
    rainbow: Boolean(THEME_TRAIL_RAINBOW[state.theme]),
  });
}

/* ============ UTIL ============ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function allCategoriesForGrade(gradeKey) {
  return Object.keys(RAW_QUESTIONS[gradeKey].categories);
}

function buildQuestionObjects(gradeKey, categoryKeys) {
  const grade = RAW_QUESTIONS[gradeKey];
  const out = [];
  for (const cat in grade.categories) {
    if (!categoryKeys.includes(cat)) continue;
    grade.categories[cat].forEach((q, i) => {
      out.push({
        id: gradeKey + '-' + cat + '-' + i,
        category: cat,
        q: q[0],
        options: q[1],
        answer: q[2],
      });
    });
  }
  return out;
}

function shuffleQuestionOptions(q) {
  const correctText = q.options[q.answer];
  const opts = shuffle(q.options);
  return { ...q, options: opts, answer: opts.indexOf(correctText) };
}

/* ============ AUDIO ENGINE (synthesized, no files needed) ============ */
const AudioEngine = (() => {
  let ctx = null;
  function ensureCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function waveForTheme() {
    if (state.theme === 'retro' || state.theme === 'cyberpunk') return 'square';
    if (state.theme === 'miku' || state.theme === 'candy') return 'triangle';
    return 'sine';
  }
  function tone(freq, dur, type, gainAmt, delay) {
    if (state.muted) return;
    const c = ensureCtx();
    if (!c) return;
    try {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(c.destination);
      const t0 = c.currentTime + (delay || 0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainAmt || 0.12, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* audio unavailable */ }
  }
  function seq(notes) {
    const w = waveForTheme();
    notes.forEach(n => tone(n.f, n.d, w, n.g, n.t));
  }
  return {
    click() { tone(500, 0.045, waveForTheme(), 0.05, 0); },
    toggle() { tone(660, 0.06, waveForTheme(), 0.06, 0); },
    correct() { seq([{ f: 523.25, d: 0.11, g: 0.11, t: 0 }, { f: 659.25, d: 0.11, g: 0.11, t: 0.07 }, { f: 783.99, d: 0.18, g: 0.12, t: 0.14 }]); },
    incorrect() { seq([{ f: 220, d: 0.16, g: 0.11, t: 0 }, { f: 164.81, d: 0.26, g: 0.1, t: 0.09 }]); },
    reveal() { seq([{ f: 392, d: 0.1, g: 0.09, t: 0 }, { f: 523.25, d: 0.18, g: 0.11, t: 0.08 }]); },
    milestone() { seq([{ f: 523.25, d: 0.09, g: 0.1, t: 0 }, { f: 659.25, d: 0.09, g: 0.1, t: 0.08 }, { f: 783.99, d: 0.09, g: 0.1, t: 0.16 }, { f: 1046.5, d: 0.24, g: 0.13, t: 0.24 }]); },
    themeSwitch() { tone(880, 0.09, 'sine', 0.06, 0); },
  };
})();

/* ============ PARTICLES & FX ============ */
let shootingStarTimer = null;
function renderParticles() {
  const layer = $('#particles');
  if (!layer) return;
  layer.innerHTML = '';
  const theme = THEMES.find(t => t.id === state.theme);
  const glyphs = theme.glyphs;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count = reduced ? 0 : 16;
  for (let i = 0; i < count; i++) {
    const span = document.createElement('span');
    span.className = 'particle';
    span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const left = Math.random() * 100;
    const dur = 14 + Math.random() * 16;
    const delay = Math.random() * -20;
    const size = 0.7 + Math.random() * 1.3;
    span.style.left = left + 'vw';
    span.style.animationDuration = dur + 's, ' + (2 + Math.random() * 2.5) + 's';
    span.style.animationDelay = delay + 's, ' + (Math.random() * -3) + 's';
    span.style.fontSize = size + 'rem';
    span.style.opacity = (0.25 + Math.random() * 0.35).toFixed(2);
    layer.appendChild(span);
  }
  clearInterval(shootingStarTimer);
  if (!reduced && state.theme === 'cosmic') {
    shootingStarTimer = setInterval(spawnShootingStar, 7000);
    setTimeout(spawnShootingStar, 1500);
  }
}

function spawnShootingStar() {
  if (state.theme !== 'cosmic') return;
  const layer = $('#particles');
  if (!layer) return;
  const star = document.createElement('div');
  star.className = 'shooting-star';
  star.style.top = (Math.random() * 35) + 'vh';
  star.style.left = (55 + Math.random() * 30) + 'vw';
  layer.appendChild(star);
  setTimeout(() => star.remove(), 1400);
}

function burstFx(targetEl, glyphOverride) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const theme = THEMES.find(t => t.id === state.theme);
  const glyphs = glyphOverride || theme.glyphs;
  const rect = targetEl ? targetEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const layer = document.createElement('div');
  layer.className = 'burst-layer';
  document.body.appendChild(layer);
  const n = 14;
  for (let i = 0; i < n; i++) {
    const span = document.createElement('span');
    span.className = 'burst-particle';
    span.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const dist = 60 + Math.random() * 70;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    span.style.left = cx + 'px';
    span.style.top = cy + 'px';
    span.style.setProperty('--dx', dx + 'px');
    span.style.setProperty('--dy', dy + 'px');
    span.style.fontSize = (0.9 + Math.random() * 0.9) + 'rem';
    layer.appendChild(span);
  }
  setTimeout(() => layer.remove(), 900);
}

/* ============ THEME ============ */
function applyTheme(themeId, silent) {
  state.theme = themeId;
  document.documentElement.setAttribute('data-theme', themeId);
  renderParticles();
  renderThemeBar();
  updateLiquidFxTheme();
  if (!silent) AudioEngine.themeSwitch();
  try { window.storage && window.storage.set('trivia:last-theme', themeId); } catch (e) {}
}

function renderThemeBar() {
  const bar = $('#theme-bar');
  if (!bar) return;
  bar.innerHTML = THEMES.map(t => `
    <button class="theme-dot ${t.id === state.theme ? 'active' : ''}" data-theme-id="${t.id}" title="${t.name}" aria-label="${t.name} theme">
      <span>${t.icon}</span>
    </button>
  `).join('');
}

function renderMuteBtn() {
  const btn = $('#btn-mute');
  if (!btn) return;
  btn.textContent = state.muted ? '🔇' : '🔊';
  btn.setAttribute('aria-label', state.muted ? 'Unmute sound' : 'Mute sound');
}

/* ============ NAVIGATION ============ */
function goHome() {
  state.screen = 'home';
  state.mode = null;
  render();
}

function openSetup(mode) {
  AudioEngine.click();
  state.mode = mode;
  state.screen = 'setup';
  state.gradeKey = null;
  state.selectedCategories = [];
  render();
}

function selectGrade(gradeKey) {
  state.gradeKey = gradeKey;
  state.selectedCategories = allCategoriesForGrade(gradeKey);
  render();
}

function toggleCategory(cat) {
  const all = allCategoriesForGrade(state.gradeKey);
  const idx = state.selectedCategories.indexOf(cat);
  if (idx >= 0) {
    if (state.selectedCategories.length === 1) return; // keep at least one
    state.selectedCategories.splice(idx, 1);
  } else {
    state.selectedCategories.push(cat);
  }
  render();
}

function selectAllCategories() {
  state.selectedCategories = allCategoriesForGrade(state.gradeKey);
  render();
}

/* ============ GAME START ============ */
function startGame() {
  if (!state.gradeKey || !state.selectedCategories.length) return;
  AudioEngine.click();
  let pool = buildQuestionObjects(state.gradeKey, state.selectedCategories);
  pool = shuffle(pool).map(shuffleQuestionOptions);

  if (state.mode === 'classic') {
    state.pool = pool.slice(0, Math.min(state.roundLength, pool.length));
    state.index = 0;
    state.score = 0;
    state.answered = false;
    state.selected = null;
    state.screen = 'game';
  } else if (state.mode === 'streak') {
    state.pool = pool;
    state.index = 0;
    state.streak = 0;
    state.answered = false;
    state.selected = null;
    state.screen = 'game';
  } else if (state.mode === 'reveal') {
    state.pool = pool;
    state.index = 0;
    state.revealed = false;
    state.players = state.players.map(p => ({ ...p, pts: 0 }));
    state.screen = 'reveal';
  }
  render();
}

async function loadBestStreak() {
  try {
    const res = await window.storage.get('trivia:best-streak');
    if (res && res.value) state.bestStreak = parseInt(res.value, 10) || 0;
  } catch (e) { /* none saved yet */ }
}
async function saveBestStreak() {
  try { await window.storage.set('trivia:best-streak', String(state.bestStreak)); } catch (e) {}
}
async function loadMutedPref() {
  try {
    const res = await window.storage.get('trivia:muted');
    if (res && res.value) state.muted = res.value === 'true';
  } catch (e) { /* none saved yet */ }
}
async function saveMutedPref() {
  try { await window.storage.set('trivia:muted', String(state.muted)); } catch (e) {}
}
async function loadLastTheme() {
  try {
    const res = await window.storage.get('trivia:last-theme');
    if (res && res.value && THEMES.some(t => t.id === res.value)) state.theme = res.value;
  } catch (e) { /* none saved yet */ }
}

function toggleMute() {
  state.muted = !state.muted;
  renderMuteBtn();
  saveMutedPref();
  if (!state.muted) AudioEngine.toggle();
}

/* ============ ANSWERING (classic + streak) ============ */
function selectAnswer(i) {
  if (state.answered) return;
  state.answered = true;
  state.selected = i;
  const q = state.pool[state.index];
  const correct = i === q.answer;

  if (state.mode === 'classic') {
    if (correct) state.score++;
  } else if (state.mode === 'streak') {
    if (correct) {
      state.streak++;
      if (state.streak > state.bestStreak) { state.bestStreak = state.streak; saveBestStreak(); }
    }
  }

  render();

  const card = $('.question-card');
  if (correct) {
    if (state.mode === 'streak' && state.streak > 0 && state.streak % 5 === 0) {
      AudioEngine.milestone();
      burstFx(card);
    } else {
      AudioEngine.correct();
      burstFx(card);
    }
  } else {
    AudioEngine.incorrect();
  }
}

function nextQuestion() {
  AudioEngine.click();
  if (state.mode === 'classic') {
    if (state.index + 1 >= state.pool.length) { state.screen = 'results'; render(); return; }
    state.index++;
    state.answered = false;
    state.selected = null;
    render();
  } else if (state.mode === 'streak') {
    const q = state.pool[state.index];
    const wasCorrect = state.selected === q.answer;
    if (!wasCorrect) { state.screen = 'results'; render(); return; }
    state.index++;
    if (state.index >= state.pool.length) {
      const fresh = shuffle(buildQuestionObjects(state.gradeKey, state.selectedCategories)).map(shuffleQuestionOptions);
      state.pool = state.pool.concat(fresh);
    }
    state.answered = false;
    state.selected = null;
    render();
  }
}

function quitToHome() { goHome(); }

/* ============ REVEAL MODE ============ */
function revealAnswer() {
  AudioEngine.reveal();
  state.revealed = true;
  render();
  burstFx($('.question-card'));
}
function revealNext() {
  AudioEngine.click();
  state.index = (state.index + 1 >= state.pool.length) ? 0 : state.index + 1;
  state.revealed = false;
  render();
}
function revealPrev() {
  AudioEngine.click();
  state.index = state.index === 0 ? state.pool.length - 1 : state.index - 1;
  state.revealed = false;
  render();
}
function addPlayer() {
  if (state.players.length >= 6) return;
  AudioEngine.click();
  state.players.push({ name: 'Player ' + (state.players.length + 1), pts: 0 });
  render();
}
function removePlayer() {
  if (state.players.length <= 1) return;
  AudioEngine.click();
  state.players.pop();
  render();
}
function bumpScore(i, delta) {
  AudioEngine.click();
  state.players[i].pts = Math.max(0, state.players[i].pts + delta);
  render();
}
function renamePlayer(i, name) { state.players[i].name = name; }
function resetScores() {
  AudioEngine.click();
  state.players = state.players.map(p => ({ ...p, pts: 0 }));
  render();
}

/* ============ RENDER ============ */
function render() {
  $$('.screen').forEach(s => s.classList.remove('active'));
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'setup') renderSetup();
  else if (state.screen === 'game') renderGame();
  else if (state.screen === 'reveal') renderReveal();
  else if (state.screen === 'results') renderResults();
}

function renderHome() {
  $('#screen-home').classList.add('active');
}

function renderSetup() {
  const el = $('#screen-setup');
  el.classList.add('active');
  const modeLabel = { classic: 'Classic Quiz', streak: 'Streak Challenge', reveal: 'Reveal & Guess' }[state.mode];
  const modeDesc = {
    classic: 'Answer a set of questions and see your score at the end.',
    streak: 'Keep going as long as you answer right. One miss ends the run!',
    reveal: 'Read questions out loud, reveal the answer, and track who got it right.',
  }[state.mode];

  const grades = Object.keys(RAW_QUESTIONS);
  const gradeChips = grades.map(g => {
    const isFun = g === 'fun';
    return `<button class="chip ${state.gradeKey === g ? 'chip-active' : ''} ${isFun ? 'chip-fun' : ''}" data-grade="${g}">
      ${isFun ? '🎉 ' : ''}${RAW_QUESTIONS[g].label}${isFun ? '<span class="fire-badge">🔥 +200</span>' : ''}
    </button>`;
  }).join('');

  let categorySection = '';
  if (state.gradeKey) {
    const cats = allCategoriesForGrade(state.gradeKey);
    const allSelected = state.selectedCategories.length === cats.length;
    const catChips = cats.map(c => {
      const on = state.selectedCategories.includes(c);
      return `<button class="chip cat-chip ${on ? 'chip-active' : ''}" data-category="${c}">
        <span class="cat-check">${on ? '✓' : ''}</span>${c}
      </button>`;
    }).join('');
    categorySection = `
      <div class="section-label-row">
        <h3 class="section-label">Categories</h3>
        <button class="mini-btn ${allSelected ? 'mini-btn-active' : ''}" id="btn-all-categories">Select All</button>
      </div>
      <div class="chip-row">${catChips}</div>
      <p class="hint-text">${state.selectedCategories.length} of ${cats.length} selected</p>
    `;
  }

  let lengthChips = '';
  if (state.mode === 'classic') {
    lengthChips = [10, 15, 20].map(n => `
      <button class="chip ${state.roundLength === n ? 'chip-active' : ''}" data-length="${n}">${n} Qs</button>
    `).join('');
  }

  const canStart = state.gradeKey && state.selectedCategories.length > 0;

  el.innerHTML = `
    <button class="back-btn" id="btn-back-home">&larr; Back</button>
    <h2 class="screen-title">${modeLabel}</h2>
    <p class="screen-desc">${modeDesc}</p>

    <h3 class="section-label">Choose a grade level</h3>
    <div class="chip-row">${gradeChips}</div>

    ${categorySection}

    ${lengthChips ? `<h3 class="section-label">Round length</h3><div class="chip-row">${lengthChips}</div>` : ''}

    <button class="btn-primary btn-start" id="btn-start" ${!canStart ? 'disabled' : ''}>
      Start ${modeLabel}
    </button>
  `;
}

function renderGame() {
  const el = $('#screen-game');
  el.classList.add('active');
  const q = state.pool[state.index];
  if (!q) return;

  const progress = state.mode === 'classic'
    ? `Question ${state.index + 1} / ${state.pool.length}`
    : `Streak: ${state.streak} 🔥`;

  const progressBar = state.mode === 'classic'
    ? `<div class="progress-track"><div class="progress-fill" style="width:${((state.index) / state.pool.length) * 100}%"></div></div>`
    : '';

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option-btn';
    if (state.answered) {
      if (i === q.answer) cls += ' correct';
      else if (i === state.selected) cls += ' incorrect';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-option="${i}" style="animation-delay:${i * 0.05}s" ${state.answered ? 'disabled' : ''}>
      <span class="opt-letter">${'ABCD'[i]}</span><span class="opt-text">${opt}</span>
    </button>`;
  }).join('');

  const feedback = state.answered
    ? (state.selected === q.answer
        ? `<p class="feedback correct-text">Correct! 🎉</p>`
        : `<p class="feedback incorrect-text">Not quite \u2014 the answer is "${q.options[q.answer]}"</p>`)
    : '';

  const nextLabel = state.mode === 'classic'
    ? (state.index + 1 >= state.pool.length ? 'See Results' : 'Next Question')
    : (state.answered && state.selected !== q.answer ? 'See Results' : 'Next Question');

  el.innerHTML = `
    <div class="game-topbar">
      <span class="progress-label">${progress}</span>
      <button class="quit-btn" id="btn-quit">&times;</button>
    </div>
    ${progressBar}
    ${state.mode === 'classic' ? `<div class="score-pill">Score: ${state.score}</div>` : ''}
    <div class="question-card">
      <span class="cat-tag">${q.category}</span>
      <h2 class="question-text">${q.q}</h2>
    </div>
    <div class="options-grid">${optionsHtml}</div>
    ${feedback}
    ${state.answered ? `<button class="btn-primary" id="btn-next">${nextLabel}</button>` : ''}
  `;
}

function renderReveal() {
  const el = $('#screen-reveal');
  el.classList.add('active');
  const q = state.pool[state.index];
  if (!q) return;

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option-btn reveal-option';
    if (state.revealed && i === q.answer) cls += ' correct';
    return `<div class="${cls}"><span class="opt-letter">${'ABCD'[i]}</span><span class="opt-text">${opt}</span>${state.revealed && i === q.answer ? ' <span class="check">\u2713</span>' : ''}</div>`;
  }).join('');

  const playersHtml = state.players.map((p, i) => `
    <div class="player-row">
      <input class="player-name" data-player-idx="${i}" value="${p.name}" />
      <button class="pts-btn minus" data-pts="-1" data-idx="${i}">\u2212</button>
      <span class="pts-value">${p.pts}</span>
      <button class="pts-btn plus" data-pts="1" data-idx="${i}">+</button>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="game-topbar">
      <span class="progress-label">Card ${state.index + 1} / ${state.pool.length}</span>
      <button class="quit-btn" id="btn-quit">&times;</button>
    </div>
    <div class="question-card">
      <span class="cat-tag">${q.category}</span>
      <h2 class="question-text">${q.q}</h2>
    </div>
    <div class="options-grid">${optionsHtml}</div>

    ${!state.revealed
      ? `<button class="btn-primary" id="btn-reveal">Reveal Answer</button>`
      : `<div class="reveal-nav">
           <button class="btn-secondary" id="btn-prev">&larr; Prev</button>
           <button class="btn-primary" id="btn-reveal-next">Next Card &rarr;</button>
         </div>`
    }

    <div class="scoreboard">
      <div class="scoreboard-head">
        <h3>Scoreboard</h3>
        <div class="scoreboard-controls">
          <button class="mini-btn" id="btn-add-player">+ Player</button>
          <button class="mini-btn" id="btn-remove-player">\u2212 Player</button>
          <button class="mini-btn" id="btn-reset-scores">Reset</button>
        </div>
      </div>
      <div class="players-list">${playersHtml}</div>
    </div>
  `;
}

function renderResults() {
  const el = $('#screen-results');
  el.classList.add('active');

  if (state.mode === 'classic') {
    const pct = Math.round((state.score / state.pool.length) * 100);
    let msg = 'Nice effort \u2014 keep practicing!';
    if (pct === 100) msg = 'Perfect score! Incredible! 🌟';
    else if (pct >= 80) msg = 'Awesome job! 🎉';
    else if (pct >= 50) msg = 'Good work! Keep it up. 💪';
    el.innerHTML = `
      <h2 class="screen-title">Quiz Complete!</h2>
      <div class="results-score" id="results-score-num">0 / ${state.pool.length}</div>
      <p class="results-pct">${pct}% correct</p>
      <p class="results-msg">${msg}</p>
      <div class="results-actions">
        <button class="btn-primary" id="btn-play-again">Play Again</button>
        <button class="btn-secondary" id="btn-change-settings">Change Settings</button>
        <button class="btn-ghost" id="btn-home">Home</button>
      </div>
    `;
    animateCountUp('results-score-num', state.score, state.pool.length);
    if (pct === 100) { setTimeout(() => burstFx($('#results-score-num')), 350); AudioEngine.milestone(); }
  } else if (state.mode === 'streak') {
    const isNewBest = state.streak > 0 && state.streak === state.bestStreak;
    el.innerHTML = `
      <h2 class="screen-title">Streak Ended</h2>
      <div class="results-score" id="results-score-num">0 🔥</div>
      <p class="results-pct">${isNewBest ? 'New personal best!' : 'Best streak: ' + state.bestStreak}</p>
      <p class="results-msg">${state.streak >= 10 ? 'Outstanding streak!' : state.streak >= 5 ? 'Great run!' : 'Keep going for a longer streak!'}</p>
      <div class="results-actions">
        <button class="btn-primary" id="btn-play-again">Play Again</button>
        <button class="btn-secondary" id="btn-change-settings">Change Settings</button>
        <button class="btn-ghost" id="btn-home">Home</button>
      </div>
    `;
    animateCountUp('results-score-num', state.streak, null, ' 🔥');
    if (isNewBest && state.streak >= 3) { setTimeout(() => burstFx($('#results-score-num')), 350); AudioEngine.milestone(); }
  }
}

function animateCountUp(elId, target, denom, suffix) {
  const el = document.getElementById(elId);
  if (!el) return;
  const dur = 500;
  const start = performance.now();
  function step(now) {
    const p = Math.min(1, (now - start) / dur);
    const val = Math.round(target * p);
    el.textContent = denom !== null && denom !== undefined ? `${val} / ${denom}` : `${val}${suffix || ''}`;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ EVENTS (delegated) ============ */
function wireEvents() {
  document.body.addEventListener('click', (e) => {
    if (e.target.closest('#btn-mute')) { toggleMute(); return; }

    const themeDot = e.target.closest('.theme-dot');
    if (themeDot) { applyTheme(themeDot.dataset.themeId); return; }

    const modeCard = e.target.closest('.mode-card');
    if (modeCard) { openSetup(modeCard.dataset.mode); return; }

    if (e.target.closest('#btn-back-home')) { AudioEngine.click(); goHome(); return; }

    const gradeChip = e.target.closest('[data-grade]');
    if (gradeChip) { AudioEngine.click(); selectGrade(gradeChip.dataset.grade); return; }

    const catChip = e.target.closest('[data-category]');
    if (catChip) { AudioEngine.click(); toggleCategory(catChip.dataset.category); return; }

    if (e.target.closest('#btn-all-categories')) { AudioEngine.click(); selectAllCategories(); return; }

    const lenChip = e.target.closest('[data-length]');
    if (lenChip) { AudioEngine.click(); state.roundLength = parseInt(lenChip.dataset.length, 10); render(); return; }

    if (e.target.closest('#btn-start')) { startGame(); return; }

    const optBtn = e.target.closest('.option-btn:not(.reveal-option)');
    if (optBtn && !optBtn.disabled) { selectAnswer(parseInt(optBtn.dataset.option, 10)); return; }

    if (e.target.closest('#btn-next')) { nextQuestion(); return; }
    if (e.target.closest('#btn-quit')) { AudioEngine.click(); quitToHome(); return; }

    if (e.target.closest('#btn-reveal')) { revealAnswer(); return; }
    if (e.target.closest('#btn-reveal-next')) { revealNext(); return; }
    if (e.target.closest('#btn-prev')) { revealPrev(); return; }
    if (e.target.closest('#btn-add-player')) { addPlayer(); return; }
    if (e.target.closest('#btn-remove-player')) { removePlayer(); return; }
    if (e.target.closest('#btn-reset-scores')) { resetScores(); return; }

    const ptsBtn = e.target.closest('.pts-btn');
    if (ptsBtn) { bumpScore(parseInt(ptsBtn.dataset.idx, 10), parseInt(ptsBtn.dataset.pts, 10)); return; }

    if (e.target.closest('#btn-play-again')) { startGame(); return; }
    if (e.target.closest('#btn-change-settings')) { AudioEngine.click(); state.screen = 'setup'; render(); return; }
    if (e.target.closest('#btn-home')) { AudioEngine.click(); goHome(); return; }
  });

  document.body.addEventListener('input', (e) => {
    if (e.target.classList.contains('player-name')) {
      renamePlayer(parseInt(e.target.dataset.playerIdx, 10), e.target.value);
    }
  });
}

/* ============ INIT ============ */
async function init() {
  wireEvents();
  await loadLastTheme();
  await loadMutedPref();
  document.documentElement.setAttribute('data-theme', state.theme);
  renderThemeBar();
  renderMuteBtn();
  renderParticles();
  initLiquidFx();
  await loadBestStreak();
  render();
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
